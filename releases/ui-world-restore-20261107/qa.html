<script>
'use strict';
const frame=document.querySelector('#game'),metrics=document.querySelector('#metrics'),entry=document.querySelector('#entry');
const describe=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {text:e.textContent.trim().slice(0,180),box:[r.x,r.y,r.width,r.height].map(x=>Math.round(x*10)/10),color:s.color,background:s.backgroundColor,font:s.fontFamily,fontSize:s.fontSize,lineHeight:s.lineHeight,whiteSpace:s.whiteSpace,scroll:[e.scrollWidth,e.clientWidth,e.scrollHeight,e.clientHeight]};};
function report(){try{const w=frame.contentWindow,d=w.document,p=w.performance,nav=p.getEntriesByType('navigation')[0],r=p.getEntriesByType('resource'),scripts=r.filter(x=>x.initiatorType==='script'||/\.js(?:$|\?)/.test(x.name)),images=r.filter(x=>x.initiatorType==='img'||/\.(png|webp)(?:$|\?)/.test(x.name));
const nodes={};for(const s of ['.game-topline','#fieldStatus','#status','#balance','#soundToggle','#reactionToggle','#pause','#pauseExit','#menuAudioDock','#battleLog','#battleLogResult','#resultSettlement','#next','#doubleUp','#cashout']){const e=d.querySelector(s);if(e&&!e.hidden&&e.getBoundingClientRect().width)nodes[s]=describe(e);}
const v={url:w.location.pathname,viewport:[w.innerWidth,w.innerHeight],navigationMs:nav&&{domContentLoaded:Math.round(nav.domContentLoadedEventEnd),load:Math.round(nav.loadEventEnd)},resourceCounts:{all:r.length,scripts:scripts.length,images:images.length},scriptBytes:{transferred:scripts.reduce((n,x)=>n+x.transferSize,0),encoded:scripts.reduce((n,x)=>n+x.encodedBodySize,0),decoded:scripts.reduce((n,x)=>n+x.decodedBodySize,0)},resourceBytes:{transferred:r.reduce((n,x)=>n+x.transferSize,0),encoded:r.reduce((n,x)=>n+x.encodedBodySize,0)},cacheNote:'transferSize 0 はキャッシュまたは制限。通信速度の保証ではありません。',diagnostics:w.__gameBootDiagnostics||[],horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,nodes};metrics.textContent=JSON.stringify(v,null,2);}catch(e){metrics.textContent=e.message;}}
function load(){metrics.textContent='読み込み中';frame.src=entry.value+'?qa='+Date.now();}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;report();});
entry.onchange=load;document.querySelector('#reload').onclick=load;frame.onload=report;setInterval(report,1000);load();
document.querySelector('#fixtures').onclick=e=>{const b=e.target.closest('button');if(!b)return;try{const qa=frame.contentWindow.DocchiQa;if(!qa||!qa.ready)throw Error('fixture版を選び、読み込み後に操作してください。比較は先にひとりで遊ぶを押してください。');const result=b.dataset.fixture?qa.run(b.dataset.fixture):b.dataset.pair?qa.comparison(b.dataset.pair.split(',')):qa[b.dataset.method]();document.querySelector('#fixtureResult').textContent=JSON.stringify(result,null,2);report();}catch(error){document.querySelector('#fixtureResult').textContent=error.message;}};
</script><script>document.querySelectorAll("[data-a1]").forEach(b=>b.onclick=e=>{e.stopPropagation();try{const out=frame.contentWindow.A1Qa[b.dataset.a1]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(error){document.querySelector("#fixtureResult").textContent=error.message}});</script><script>document.querySelectorAll("[data-result-feedback]").forEach(b=>b.onclick=()=>{try{const qa=frame.contentWindow.ResultFeedbackQA,k=b.dataset.resultFeedback;const out=k==="run"?qa.run("B","B"):k==="middle"?qa.at(1200):k==="finish"?qa.at(2500):qa[k]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-name-layout]").forEach(b=>b.onclick=()=>{try{const out=frame.contentWindow.NameLayoutQA[b.dataset.nameLayout]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-boss]").forEach(b=>b.onclick=()=>{try{document.querySelector("#fixtureResult").textContent=JSON.stringify(frame.contentWindow.BossMarkerQA[b.dataset.boss](),null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-stable]").forEach(b=>b.onclick=()=>{try{const qa=frame.contentWindow.StableHeaderQA,k=b.dataset.stable,out=k==="solo"||k==="multi"?qa.cycle(k):qa[k]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-horizontal]").forEach(b=>b.onclick=()=>{try{const out=frame.contentWindow.HorizontalHeaderQA.cycle(b.dataset.horizontal);document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>/* approved-name-qa-controls-start */
(()=>{const select=document.querySelector('#approvedNamePair'),show=document.querySelector('#approvedNameShow'),next=document.querySelector('#approvedNameNext');const sync=()=>{show.dataset.pair=select.value;};select.onchange=sync;next.onclick=event=>{event.stopPropagation();select.selectedIndex=(select.selectedIndex+1)%select.options.length;sync();show.click();};sync();})();
/* approved-name-qa-controls-end */</script><script>document.querySelectorAll('[data-result-controls]').forEach(b=>b.onclick=()=>{try{const qa=frame.contentWindow.ResultControlsQA;if(!qa)throw Error('結果・比較fixtureを選んでください。');const k=b.dataset.resultControls,out=k==='solo'||k==='multi'?qa.result(k):k==='final'?qa.result('solo',true):qa[k]();document.querySelector('#fixtureResult').textContent=JSON.stringify(out,null,2);report();}catch(e){document.querySelector('#fixtureResult').textContent=e.message;}});</script><script>document.querySelectorAll('[data-overtime]').forEach(b=>b.onclick=()=>{try{const qa=frame.contentWindow.OvertimeQA;if(!qa)throw Error('結果・比較fixtureを選んでください。');const [kind,mode]=b.dataset.overtime.split(',');document.querySelector('#fixtureResult').textContent=JSON.stringify(qa.review(kind,mode),null,2);report();}catch(e){document.querySelector('#fixtureResult').textContent=e.message;}});</script><script>document.querySelectorAll('[data-log-colors]').forEach(b=>b.onclick=()=>{try{const qa=frame.contentWindow.LogColorsQA;if(!qa)throw Error('結果・比較fixtureを選んでください。');const k=b.dataset.logColors,out=k==='measure'?qa.measure():qa.run(k);document.querySelector('#fixtureResult').textContent=JSON.stringify(out,null,2);report();}catch(e){document.querySelector('#fixtureResult').textContent=e.message;}});</script><script>/* terrain-visible-qa-controls-20261106 */
document.querySelectorAll('[data-terrain-qa]').forEach(button=>button.onclick=event=>{event.stopPropagation();try{const qa=frame.contentWindow.TerrainQA;if(!qa)throw Error('「結果・比較fixture」または「GRAVITY fixture」を選び、読込後に操作してください。');const kind=button.dataset.terrainQa,result=kind==='apply'?qa.apply(document.querySelector('#terrainQAField').value,Number(document.querySelector('#terrainQAStrength').value)):qa[kind]();document.querySelector('#fixtureResult').textContent=JSON.stringify(result,null,2);report();}catch(error){document.querySelector('#fixtureResult').textContent=error.message;}});

document.querySelectorAll('[data-upper-reaction]').forEach(button=>button.onclick=event=>{event.stopPropagation();try{const qa=frame.contentWindow.UpperReactionQA;if(!qa)throw Error('「結果・比較fixture」または「GRAVITY fixture」を選んでください。');document.querySelector('#fixtureResult').textContent=JSON.stringify(qa.run(button.dataset.upperReaction),null,2);report();}catch(error){document.querySelector('#fixtureResult').textContent=error.message;}});
</script><script>document.querySelectorAll('[data-matchup-history]').forEach(button=>button.onclick=event=>{event.stopPropagation();try{const qa=frame.contentWindow.MatchupHistoryQA;if(!qa)throw Error('「結果・比較fixture」を選び、読込後に操作してください。');document.querySelector('#fixtureResult').textContent=JSON.stringify(qa.review(Number(button.dataset.matchupHistory)),null,2);report();}catch(error){document.querySelector('#fixtureResult').textContent=error.message;}});</script></html>
