<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カウントダウン検証</title><style>body{margin:0;background:#f6eedc;font:14px system-ui;color:#322}header{padding:8px}button{font:inherit;padding:6px 12px}iframe{display:block;border:0;width:100%;height:800px}pre{white-space:pre-wrap;font-size:12px}</style><header>CPU検証専用。GRAVITY・外部ランキングには接続しません。<br><button id="create" disabled>CPU 3人で作成</button><button id="quiet" disabled>自動入力なしで作成</button><button id="bots">CPU予想を確定</button><pre id="trace">カウントダウン待ち</pre></header><iframe id="game" src="game.html"></iframe><script>const game=document.querySelector('#game'),button=document.querySelector('#create');window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==game.contentWindow)return;if(e.data?.type==='docchi-cpu-test-ready'){button.disabled=false;document.querySelector('#quiet').disabled=false;}if(e.data?.type==='countdown-trace')document.querySelector('#trace').textContent=JSON.stringify(e.data.rows,null,2)});button.onclick=()=>game.contentWindow.DocchiCpuTest.create(3);document.querySelector('#quiet').onclick=()=>game.contentWindow.DocchiCpuTest.create(3,{mode:'idle'});document.querySelector('#bots').onclick=()=>game.contentWindow.DocchiCpuTest.confirmBots();</script></html>
