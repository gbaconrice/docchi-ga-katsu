<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10戦ルール表示テスト</title><style>body{margin:0;background:#f6eedc;font:14px system-ui;color:#322}header{padding:8px}button{font:inherit;padding:5px 9px;margin:2px}iframe{display:block;border:0;width:100%;height:800px}pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto}</style><header>表示テスト専用。合成結果で早送りします。GRAVITY・外部ランキングには接続しません。<div id="buttons"><button data-round="1">1戦 予想</button><button data-round="6">6戦 予想</button><button data-round="8">8戦 予想</button><button data-round="10">10戦 予想</button><button data-round="10" data-zero="true">10戦 0G</button><button data-round="10" data-phase="result">10戦 結果5秒</button><button data-round="10" data-phase="final">10戦 最終順位</button></div><div id="sizes"><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="480">480px</button></div><pre id="trace">読込中</pre></header><iframe id="game" src="rules-game.html"></iframe><script>const game=document.querySelector('#game'),buttons=[...document.querySelectorAll('#buttons button')];document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{game.style.width=b.dataset.width+'px';game.style.margin='0 auto';});buttons.forEach(b=>{b.disabled=true;b.onclick=()=>game.contentWindow.DocchiRulesTest.prepare(Number(b.dataset.round),b.dataset.phase||'predict',b.dataset.zero==='true')});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==game.contentWindow)return;if(e.data?.type==='docchi-rules-test-ready'){buttons.forEach(b=>b.disabled=false);document.querySelector('#trace').textContent='準備できました'}if(e.data?.type==='rules-trace')document.querySelector('#trace').textContent=JSON.stringify(e.data.data,null,2);if(e.data?.type==='rules-error')document.querySelector('#trace').textContent='ERROR: '+e.data.message});</script></html>
