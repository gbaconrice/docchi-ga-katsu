<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表示・読込確認</title>
<style>body{margin:0;padding:12px;background:#eee;color:#17212b;font:14px system-ui,sans-serif}button,select{font:inherit;padding:7px;margin:2px}header{max-width:1100px}main{display:flex;align-items:flex-start;gap:16px;margin-top:12px}iframe{border:1px solid #87949f;background:white;flex:none}pre{white-space:pre-wrap;max-width:620px;margin:0;overflow-wrap:anywhere;font:12px/1.5 system-ui,sans-serif}h1{font-size:16px;margin:0 0 8px}#fixtureResult{max-height:150px;overflow:auto}</style>
<header><h1>画面修正 実装確認（デスクトップブラウザ）</h1>
<button data-size="320,568">320 px</button><button data-size="375,667">375 px</button><button data-size="390,844">390 px</button><button data-size="430,932">430 px</button>
<select id="entry" aria-label="確認版"><option value="index.html">画面修正候補</option><option value="gravity-entry.html">GRAVITY余白</option><option value="qa-failure-entry.html">通信失敗と再試行</option><option value="qa-entry.html">結果・比較fixture</option><option value="qa-motion-entry.html">演出の実時間確認</option><option value="qa-gravity-entry.html">GRAVITY fixture</option><option value="../../releases/a1-material-v2-20261106/index.html">現在の公開版</option></select><button id="reload">再読込</button>
<div id="fixtures"><button data-a1="picks">選択アバター8人</button><button data-a1="battle">戦場の参加者8人</button><button data-fixture="solo-left">左勝ち</button><button data-fixture="solo-right">右勝ち</button><button data-fixture="solo-draw">引分</button><button data-fixture="solo-final">10戦終了</button><button data-fixture="solo-final-zero">10戦0G</button><button data-fixture="multi-left">8人長名・長額</button><button data-method="waitTenMinutes">10分経過</button><button data-method="openLog">履歴を開く</button><button data-method="closeLog">履歴を閉じる</button><button data-method="next">次へ</button><button data-pair="frosthorn_rhino,shockplate_drake">大型・連撃比較</button><button data-pair="rider,spirit_fan_wolf">扇射比較</button><button data-pair="crimson_mender,repair_pylon">支援比較</button></div><button data-result-feedback="run">結果演出</button><button data-result-feedback="middle">金貨途中</button><button data-result-feedback="finish">金貨確定</button><button data-result-feedback="openLog">結果履歴</button><button data-result-feedback="closeLog">結果へ戻る</button><button data-name-layout="photo">画像の長名</button><button data-name-layout="longest">最長名6種</button><button data-name-layout="details">名前・詳細</button><button data-name-layout="comparison">名前・比較</button><button data-name-layout="start">名前の先頭</button><button data-name-layout="end">名前の末尾</button><button data-boss="choose">大型と通常</button><button data-boss="fail">マーク画像404</button><button data-boss="measure">マーク状態確認</button><button data-stable="solo">上部ソロ全遷移</button><button data-stable="multi">上部マルチ全遷移</button><button data-stable="log">固定上部の履歴</button><button data-stable="closeLog">固定上部の結果</button><button data-stable="next">固定上部の次戦</button><button data-horizontal="solo">横並びソロ検証</button><button data-horizontal="multi">横並びマルチ検証</button><pre id="fixtureResult"></pre></header>
<main><iframe id="game" width="390" height="844" title="ゲーム確認"></iframe><pre id="metrics" aria-live="polite"></pre></main>
<script>
'use strict';
const frame=document.querySelector('#game'),metrics=document.querySelector('#metrics'),entry=document.querySelector('#entry');
const describe=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {text:e.textContent.trim().slice(0,180),box:[r.x,r.y,r.width,r.height].map(x=>Math.round(x*10)/10),color:s.color,background:s.backgroundColor,font:s.fontFamily,fontSize:s.fontSize,lineHeight:s.lineHeight,whiteSpace:s.whiteSpace,scroll:[e.scrollWidth,e.clientWidth,e.scrollHeight,e.clientHeight]};};
function report(){try{const w=frame.contentWindow,d=w.document,p=w.performance,nav=p.getEntriesByType('navigation')[0],r=p.getEntriesByType('resource'),scripts=r.filter(x=>x.initiatorType==='script'||/\.js(?:$|\?)/.test(x.name)),images=r.filter(x=>x.initiatorType==='img'||/\.(png|webp)(?:$|\?)/.test(x.name));
const nodes={};for(const s of ['.game-topline','#fieldStatus','#status','#balance','#soundToggle','#reactionToggle','#pause','#pauseExit','#menuAudioDock','#battleLog','#battleLogResult','#resultSettlement','#next','#doubleUp','#cashout']){const e=d.querySelector(s);if(e&&!e.hidden&&e.getBoundingClientRect().width)nodes[s]=describe(e);}
const v={url:w.location.pathname,viewport:[w.innerWidth,w.innerHeight],navigationMs:nav&&{domContentLoaded:Math.round(nav.domContentLoadedEventEnd),load:Math.round(nav.loadEventEnd)},resourceCounts:{all:r.length,scripts:scripts.length,images:images.length},scriptBytes:{transferred:scripts.reduce((n,x)=>n+x.transferSize,0),encoded:scripts.reduce((n,x)=>n+x.encodedBodySize,0),decoded:scripts.reduce((n,x)=>n+x.decodedBodySize,0)},resourceBytes:{transferred:r.reduce((n,x)=>n+x.transferSize,0),encoded:r.reduce((n,x)=>n+x.encodedBodySize,0)},cacheNote:'transferSize 0 はキャッシュまたは制限。通信速度の保証ではありません。',diagnostics:w.__gameBootDiagnostics||[],horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,nodes};metrics.textContent=JSON.stringify(v,null,2);}catch(e){metrics.textContent=e.message;}}
function load(){metrics.textContent='読み込み中';frame.src=entry.value+'?qa='+Date.now();}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;report();});
entry.onchange=load;document.querySelector('#reload').onclick=load;frame.onload=report;setInterval(report,1000);load();
document.querySelector('#fixtures').onclick=e=>{const b=e.target.closest('button');if(!b)return;try{const qa=frame.contentWindow.DocchiQa;if(!qa||!qa.ready)throw Error('fixture版を選び、読み込み後に操作してください。比較は先にひとりで遊ぶを押してください。');const result=b.dataset.fixture?qa.run(b.dataset.fixture):b.dataset.pair?qa.comparison(b.dataset.pair.split(',')):qa[b.dataset.method]();document.querySelector('#fixtureResult').textContent=JSON.stringify(result,null,2);report();}catch(error){document.querySelector('#fixtureResult').textContent=error.message;}};
</script><script>document.querySelectorAll("[data-a1]").forEach(b=>b.onclick=e=>{e.stopPropagation();try{const out=frame.contentWindow.A1Qa[b.dataset.a1]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(error){document.querySelector("#fixtureResult").textContent=error.message}});</script><script>document.querySelectorAll("[data-result-feedback]").forEach(b=>b.onclick=()=>{try{const qa=frame.contentWindow.ResultFeedbackQA,k=b.dataset.resultFeedback;const out=k==="run"?qa.run("B","B"):k==="middle"?qa.at(1200):k==="finish"?qa.at(2500):qa[k]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-name-layout]").forEach(b=>b.onclick=()=>{try{const out=frame.contentWindow.NameLayoutQA[b.dataset.nameLayout]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-boss]").forEach(b=>b.onclick=()=>{try{document.querySelector("#fixtureResult").textContent=JSON.stringify(frame.contentWindow.BossMarkerQA[b.dataset.boss](),null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-stable]").forEach(b=>b.onclick=()=>{try{const qa=frame.contentWindow.StableHeaderQA,k=b.dataset.stable,out=k==="solo"||k==="multi"?qa.cycle(k):qa[k]();document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script><script>document.querySelectorAll("[data-horizontal]").forEach(b=>b.onclick=()=>{try{const out=frame.contentWindow.HorizontalHeaderQA.cycle(b.dataset.horizontal);document.querySelector("#fixtureResult").textContent=JSON.stringify(out,null,2);report()}catch(e){document.querySelector("#fixtureResult").textContent=e.message}});</script></html>
