<!doctype html><html><meta charset="utf-8"><title>Header verification</title><style>body{font:14px system-ui;background:#ddd}iframe{display:block;border:0}pre{white-space:pre-wrap}</style>
<button id="solo">Solo</button><button id="matrix">Measure all widths and terrains</button><button id="pauseCheck">Check prediction menu</button><button id="gravity">Gravity inset</button><button id="normal">Normal inset</button><button id="wide">Desktop</button><button id="narrow">Mobile</button><iframe id="game" width="390" height="844" src="../../releases/header-refine-20261107/gravity-entry.html"></iframe><pre id="report"></pre><script>
const frame=document.querySelector('#game'),out=document.querySelector('#report');let results=[];
const d=()=>frame.contentDocument,w=()=>frame.contentWindow,q=s=>d().querySelector(s),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
function measure(fixture){const prediction=q('#battleChoice'),feedback=q('#reaction-feedback'),terrain=q('#fieldStatus'),status=q('#status'),wallet=q('.wallet-pill'),a=rect(terrain),b=rect(status),c=rect(wallet),sound=q('#soundToggle'),reaction=q('#reactionToggle'),pause=q('#pause'),s=w().getComputedStyle(terrain),br=rect(sound),rr=rect(reaction),pr=rect(pause);return {fixture,width:Number(frame.width),gapLeft:b.x-a.right,gapRight:c.x-b.right,terrain:a,round:b,wallet:c,field:terrain.dataset.field,color:s.color,weight:w().getComputedStyle(status).fontWeight,toolbar:{reaction:rr,sound:br,pause:pr},checks:{predictionLeftAligned:Math.abs(rect(prediction).x-a.x)<1,predictionCentered:Math.abs((rect(prediction).y+rect(prediction).height/2)-(rr.y+rr.height/2))<1,predictionBeforeControls:rect(prediction).right<=rr.x,predictionAvoidsFeedback:feedback.hidden||w().getComputedStyle(feedback).display==='none'||rect(prediction).right<=rect(feedback).x,equalGaps:Math.abs((b.x-a.right)-(c.x-b.right))<.6,minGaps:b.x-a.right>=7.9&&c.x-b.right>=7.9,noOverlap:a.right<=b.x&&b.right<=c.x,fullTerrain:terrain.textContent===fixture.text,fullGold:q('#balance').textContent===fixture.gold,noOverflow:d().documentElement.scrollWidth<=Number(frame.width),bold:Number(w().getComputedStyle(status).fontWeight)>=700,noInfo:w().getComputedStyle(q('#unitsToggle')).display==='none',audioInToolbar:sound.parentElement.id==='gameToolbar',audio44:br.width===44&&br.height===44,order:rr.right<=br.x&&br.right<=pr.x,sameRow:rr.y===br.y&&br.y===pr.y,terrainScrollable:terrain.scrollWidth<=terrain.clientWidth||s.overflowX==='auto',goldScrollable:q('#balance').scrollWidth<=q('#balance').clientWidth||w().getComputedStyle(q('#balance')).overflowX==='auto'}}}
const show=()=>out.textContent=JSON.stringify({results,allPassed:results.every(x=>Object.values(x.checks||{}).every(Boolean))},null,2);
document.querySelector('#solo').onclick=()=>{q('#soloStart').click()};
document.querySelector('#matrix').onclick=async()=>{results=[];const old={field:q('#fieldStatus').dataset.field,text:q('#fieldStatus').textContent,gold:q('#balance').textContent};const fields=[['grassland','草原 · 補正なし'],['shallow_ford','浅瀬 · 地上移動−10%'],['crosswind_ridge','荒野 · 射撃間合い−10%'],['desert','砂漠 · 回復量−10%'],['icefield','氷原 · 押し出し距離+10%'],['highland','高地 · 飛行移動−10%'],['rockfield','岩場 · 突撃追加ダメージ−8%'],['volcano','火山 · 地上に最大HP4%ダメージ/8秒']];for(const width of [320,375,390,430,768,1200]){frame.width=width;for(const [field,text] of fields){for(const gold of ['100','12,430','99,999,999,999,999,999,999']){q('#fieldStatus').dataset.field=field;q('#fieldStatus').textContent=text;q('#balance').textContent=gold;await tick();results.push(measure({field,text,gold}));}}}q('#fieldStatus').dataset.field=old.field;q('#fieldStatus').textContent=old.text;q('#balance').textContent=old.gold;frame.width=390;show();};
document.querySelector('#pauseCheck').onclick=()=>{q('#pause').click();const dialog=q('#pausePanel');const visible=[...dialog.querySelectorAll('h2,p,button')].filter(e=>!e.hidden&&w().getComputedStyle(e).display!=='none');out.textContent=JSON.stringify({visible:visible.map(e=>({tag:e.tagName,text:e.textContent,rect:rect(e)})),allPassed:visible.length===2&&visible[0].textContent==='閉じる'&&visible[1].textContent==='ゲームを終了する'},null,2)};
document.querySelector('#gravity').onclick=()=>{d().documentElement.dataset.hostShell='gravity';out.textContent='Gravity inset enabled for visual QA';};document.querySelector('#normal').onclick=()=>{delete d().documentElement.dataset.hostShell;};document.querySelector('#wide').onclick=()=>{frame.width=1200;};document.querySelector('#narrow').onclick=()=>{frame.width=320;};
const fixtureButton=document.createElement('button');fixtureButton.id='predictionStates';fixtureButton.textContent='Check prediction states';document.body.insertBefore(fixtureButton,frame);
fixtureButton.onclick=async()=>{const badge=q('#battleChoice'),feedback=q('#reaction-feedback'),wrap=q('#participantRailWrap'),rail=q('#participantRail');const save={badge:badge.textContent,feedback:feedback.textContent,hidden:feedback.hidden,active:feedback.dataset.active,solo:wrap.dataset.solo,wrapHidden:wrap.hidden,railHidden:rail.hidden,rail:rail.innerHTML};let rows=[];try{feedback.hidden=false;feedback.textContent='😄';for(const width of [320,375,390,430,768,1200]){frame.width=width;for(const label of ['予想：未選択','予想：左','予想：右']){await tick();badge.textContent=label;feedback.hidden=false;feedback.dataset.active='true';const a=rect(badge),b=rect(feedback),e=rect(q('#reactionToggle')),terrain=rect(q('#fieldStatus'));rows.push({width,label,badge:a,feedback:b,controls:e,pass:Math.abs(a.x-terrain.x)<1&&Math.abs((a.y+a.height/2)-(e.y+e.height/2))<1&&a.right<=b.x&&b.right<=e.x});}}frame.width=320;await tick();wrap.dataset.solo='false';wrap.hidden=false;rail.hidden=false;rail.innerHTML=Array.from({length:16},(_,i)=>'<span style="flex:0 0 44px;width:44px;height:32px">参加'+(i+1)+'</span>').join('');rows.push({kind:'multiplayer rail DOM fixture only',below:rect(wrap).y>=rect(q('#gameToolbar')).bottom,scrollable:rail.scrollWidth>rail.clientWidth,overflowX:w().getComputedStyle(rail).overflowX,pass:rect(wrap).y>=rect(q('#gameToolbar')).bottom&&rail.scrollWidth>rail.clientWidth&&w().getComputedStyle(rail).overflowX==='auto'});out.textContent=JSON.stringify({results:rows,allPassed:rows.every(x=>x.pass)},null,2);}finally{badge.textContent=save.badge;feedback.textContent=save.feedback;feedback.hidden=save.hidden;if(save.active===undefined)delete feedback.dataset.active;else feedback.dataset.active=save.active;if(save.solo===undefined)delete wrap.dataset.solo;else wrap.dataset.solo=save.solo;wrap.hidden=save.wrapHidden;rail.hidden=save.railHidden;rail.innerHTML=save.rail;frame.width=390;}};
const fontButton=document.createElement('button');fontButton.id='goldFonts';fontButton.textContent='Check gold typography';document.body.insertBefore(fontButton,frame);
fontButton.onclick=async()=>{const screen=q('#gameScreen'),panel=q('#resultPanel'),earned=q('#breakdown'),held=q('#balance');const save={phase:screen.dataset.phase,earned:panel.dataset.earned,double:panel.dataset.doubleUp};const rows=[];try{panel.dataset.earned='true';for(const width of [320,375,390,430,768,1200]){frame.width=width;for(const phase of ['choose','fight','result'])for(const doubling of ['false','true']){screen.dataset.phase=phase;panel.dataset.doubleUp=doubling;await tick();const a=w().getComputedStyle(held),b=w().getComputedStyle(earned);rows.push({width,phase,doubling,held:{family:a.fontFamily,weight:a.fontWeight,style:a.fontStyle,size:a.fontSize,overflow:a.overflowX},earned:{family:b.fontFamily,weight:b.fontWeight,style:b.fontStyle},pass:a.fontFamily===b.fontFamily&&a.fontWeight===b.fontWeight&&a.fontStyle===b.fontStyle&&a.fontSize==='26px'&&a.overflowX==='auto'});}}out.textContent=JSON.stringify({results:rows,allPassed:rows.every(x=>x.pass)},null,2);}finally{for(const [node,key,val] of [[screen,'phase',save.phase],[panel,'earned',save.earned],[panel,'doubleUp',save.double]]){if(val===undefined)delete node.dataset[key];else node.dataset[key]=val;}frame.width=390;}};
</script></html>
