<!doctype html><html><meta charset="utf-8"><title>Home audio verification</title><style>body{font:14px system-ui;background:#ddd}iframe{display:block;border:0}pre{white-space:pre-wrap}</style><button id="check">Check home and game audio</button><button id="solo">Solo</button><iframe id="game" width="390" height="844" src="../../index.html"></iframe><pre id="report"></pre><script>
const frame=document.querySelector('#game'),out=document.querySelector('#report'),q=s=>frame.contentDocument.querySelector(s),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))),style=e=>frame.contentWindow.getComputedStyle(e);document.querySelector('#solo').onclick=()=>q('#soloStart').click();
document.querySelector('#check').onclick=async()=>{let results=[];const node=q('#soundToggle');for(const width of [320,390,1200]){frame.width=width;await tick();const before={parent:node.parentElement.id,display:style(node).display,width:node.getBoundingClientRect().width};q('#soloStart').click();await tick();const game={parent:node.parentElement.id,display:style(node).display,width:node.getBoundingClientRect().width,height:node.getBoundingClientRect().height,sameNode:q('#soundToggle')===node};q('#pause').click();q('#pauseExit').click();await tick();const after={parent:node.parentElement.id,display:style(node).display,width:node.getBoundingClientRect().width};results.push({width,before,game,after,pass:before.parent==='homeScreen'&&before.display==='none'&&before.width===0&&game.parent==='gameToolbar'&&game.display!=='none'&&game.width===44&&game.height===44&&game.sameNode&&after.parent==='homeScreen'&&after.display==='none'&&after.width===0});}frame.width=390;out.textContent=JSON.stringify({results,allPassed:results.every(x=>x.pass)},null,2)};
</script></html>
