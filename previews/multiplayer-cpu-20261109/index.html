<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>どっちが勝つ CPUテスト専用</title>
<style>*{box-sizing:border-box}body{margin:0;background:#191713;color:#f8eedc;font:14px/1.5 system-ui}main{display:grid;grid-template-columns:minmax(230px,320px) minmax(320px,1fr);min-height:100dvh}aside{padding:16px}h1{font-size:18px;margin:0 0 8px}button,select{font:inherit;padding:9px;margin:4px 4px 4px 0;min-height:40px}iframe{width:100%;height:100dvh;border:0;background:#201a16}label{display:block}#status{white-space:pre-line;font-size:12px;color:#d4c7af}.note{color:#d4c7af;font-size:12px}#error{color:#ffb5a9}li{margin-bottom:5px}@media(max-width:700px){main{display:flex;flex-direction:column}aside{padding:10px}h1{font-size:16px}.note{margin:4px 0}iframe{height:80dvh}#status{max-height:100px;overflow:auto}}</style>
<main><aside><h1>CPUテスト専用</h1><p class="note">本番の部屋・ランキングには接続しません。CPUはローカルで動作する仮の参加者です。</p><label>CPU人数 <select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label><label>動作 <select id="mode"><option value="normal">選択して確定</option><option value="select-only">選択だけ（時間切れ確認）</option><option value="idle">何もしない（時間切れ確認）</option></select></label><button id="create" disabled>テストルームを作る</button><button id="add" disabled>CPUを1人追加</button><button id="emote" disabled>CPUのエモート</button><p class="note">ルームで「対戦を開始」を押してください。CPUは予想を選んでから確定します。通常CPUは10～12戦目に順次終了します。</p><p class="note">通信切断、GRAVITYの実プロフィール、外部ランキングへの送信はこのテストでは確認できません。</p><p id="error" role="alert"></p><p id="status">ゲームを準備中</p></aside><iframe id="game" title="CPU対戦テスト" src="game.html?rev=fbdaf5378bc17f9f8f45" allow="autoplay"></iframe></main>
<script>
const frame=document.querySelector('#game'),q=id=>document.querySelector(id);let ready=false;
function api(){return frame.contentWindow.DocchiCpuTest}function run(fn){try{q('#error').textContent='';fn();render()}catch(e){q('#error').textContent=e.message}}
q('#create').onclick=()=>run(()=>api().create(Number(q('#count').value),{mode:q('#mode').value}));q('#add').onclick=()=>run(()=>api().add({mode:q('#mode').value}));q('#emote').onclick=()=>run(()=>api().emote(api().snapshot()?.bots[0]?.id));
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data?.type==='docchi-cpu-test-ready'){ready=true;q('#create').disabled=false;render()}});
function render(){if(!ready)return;const r=api().snapshot();q('#add').disabled=!r||r.state.phase!=='lobby'||r.state.roundId!==null||r.bots.length>=7;q('#emote').disabled=!r||!['predict','battle','result'].includes(r.state.phase);q('#status').textContent=r?'段階: '+r.state.phase+' / '+(r.state.roundId||0)+'戦\n参加: '+r.state.participants.length+'人 / 確定: '+r.state.readyIds.length+'人\n'+r.bots.map(b=>b.name+' : '+b.phase+' / 終了予定 '+b.cashOutRound+'戦').join('\n'):'テストルームを作成してください';}setInterval(render,300);
</script></html>
