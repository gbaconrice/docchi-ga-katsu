<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layout repair checks</title>
<style>body{font:14px system-ui;background:#eee;color:#222;margin:12px}button,input{font:inherit;padding:8px;margin:3px}iframe{display:block;background:#fff;border:1px solid #777}pre{white-space:pre-wrap;max-width:900px}label{display:block}#entry{width:min(700px,90vw)}</style>
<label>Candidate entry <input id="entry" value="index.html"></label>
<button id="reload">Reload</button><button data-size="320,568">320 × 568</button><button data-size="375,667">375 × 667</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button>
<button data-size="390,660">390 × 660</button><button data-size="430,740">430 × 740</button>
<button id="solo">Open solo</button><button id="long">Long terrain and gold fixture</button><button id="normal">Normal labels</button><button id="read">Read geometry</button>
<p>Use the real controls inside the frame for menu, list, reactions and exit. The long-label button changes display text only, not wallet data or game rules. This fixture requires same-origin HTTP hosting.</p>
<iframe id="game" title="Layout candidate" width="390" height="844"></iframe><pre id="report"></pre>
<script>
const frame=document.querySelector('#game'),report=document.querySelector('#report');let width=390,height=844,fixture=null;
function load(){fixture=null;frame.width=width;frame.height=height;frame.src=new URL(document.querySelector('#entry').value,location.href).href;report.textContent='';}
const doc=()=>frame.contentDocument;
document.querySelector('#reload').onclick=load;
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{[width,height]=b.dataset.size.split(',').map(Number);load();};
document.querySelector('#solo').onclick=()=>{doc().querySelector('#soloStart').click();read();};
document.querySelector('#long').onclick=()=>{fixture={terrain:'火山 · 地上に最大HP4%ダメージ/8秒',gold:'99,999,999,999,999,999,999'};doc().querySelector('#fieldStatus').textContent=fixture.terrain;doc().querySelector('#balance').textContent=fixture.gold;read();};
document.querySelector('#normal').onclick=()=>{fixture={terrain:'草原 · 補正なし',gold:'100'};doc().querySelector('#fieldStatus').textContent=fixture.terrain;doc().querySelector('#balance').textContent=fixture.gold;read();};
document.querySelector('#read').onclick=read;
function read(){try{const d=doc(),w=frame.contentWindow,ids=['app','homeScreen','soundToggle','gameTopline','fieldStatus','status','balance','gameToolbar','battleChoice','battleClock','unitsToggle','reactionToggle','pause','reaction-feedback','participantRailWrap','participantRail','comparison','fieldStage'];const nodes={};for(const id of ids){const e=d.getElementById(id);if(!e)continue;const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);nodes[id]={text:e.textContent,hidden:e.hidden,disabled:!!e.disabled,parent:e.parentElement?.id,tabIndex:e.tabIndex,x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom,scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,display:s.display,overflowX:s.overflowX,textOverflow:s.textOverflow,fontSize:s.fontSize};}const game=d.getElementById('gameScreen'),a=nodes.fieldStatus,b=nodes.status,c=d.querySelector('.wallet-pill')?.getBoundingClientRect(),sound=nodes.soundToggle;const gameVisible=game&&!game.hidden;const checks=gameVisible?{oneHeaderRow:a.y>=nodes.gameTopline.y&&a.bottom<=nodes.gameTopline.bottom&&b.y>=nodes.gameTopline.y&&b.bottom<=nodes.gameTopline.bottom&&sound.bottom<=nodes.gameTopline.bottom,orderedSlots:a.right<=b.x+.5&&b.right<=c.x+.5&&c.right<=sound.x+.5,sound44:sound.width===44&&sound.height===44,toolbar44:nodes.gameToolbar.height===44,utilitiesVisible:['unitsToggle','reactionToggle','pause'].every(id=>nodes[id].width===44&&nodes[id].height===44),terrainKeyboard:nodes.fieldStatus.tabIndex===0,fullGoldRetained:!fixture||nodes.balance.text===fixture.gold,fullTerrainRetained:!fixture||nodes.fieldStatus.text===fixture.terrain,longGoldScrollable:nodes.balance.scrollWidth<=nodes.balance.clientWidth||nodes.balance.overflowX==='auto',longTerrainScrollable:nodes.fieldStatus.scrollWidth<=nodes.fieldStatus.clientWidth||nodes.fieldStatus.overflowX==='auto',noPageOverflow:d.documentElement.scrollWidth<=width}:null;report.textContent=JSON.stringify({viewport:{width,height},phase:game?.dataset.phase,fixture,checks,nodes},null,2);}catch(e){report.textContent=String(e);}}
load();
</script></html>
