<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>どっちが勝つ？</title><style>:root {
  color-scheme: dark;
  --page: #111a20;
  --panel: #212d30;
  --panel-raised: #2b3b3d;
  --line: #65756e;
  --text: #efe7d3;
  --muted: #c3beac;
  --gold: #f1cf82;
  --red: #e18a76;
  --blue: #90c5e9;
  --tap: 44px;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--page); }
body {
  min-height: 100vh;
  min-height: 100dvh;
  min-height: var(--app-viewport-height, var(--app-viewport-default, 100vh));
  margin: 0;
  color: var(--text);
  background: var(--page);
  font-family: system-ui, sans-serif;
  overflow: hidden;
}
button, input { font: inherit; }
button {
  min-height: var(--tap);
  border: 1px solid #a69c7c;
  border-radius: 10px;
  color: var(--text);
  background: var(--panel-raised);
  font-weight: 700;
  touch-action: manipulation;
  cursor: pointer;
}
button:focus-visible, input:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}
button:disabled { opacity: .48; cursor: default; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* Standalone uses the browser safe area; an embedded host may supply only a measured, viewport-relative overlay inset. */
#app {
  width: min(100%, 520px);
  height: 100vh;
  height: 100dvh;
  height: var(--app-viewport-height, var(--app-viewport-default, 100vh));
  min-height: 100vh;
  min-height: 100dvh;
  min-height: var(--app-viewport-height, var(--app-viewport-default, 100vh));
  margin-inline: auto;
  padding-block-start: calc(max(env(safe-area-inset-top, 0px), var(--gravity-host-top-inset, 0px)) + 8px);
  padding-block-end: calc(max(env(safe-area-inset-bottom, 0px), var(--gravity-host-bottom-inset, 0px)) + 10px);
  padding-inline: 12px;
  display: flex;
  flex-direction: column;
}
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 44px;
  margin: 0 0 8px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
h1 { margin: 0; font-size: 21px; letter-spacing: .05em; }
.wallet-pill {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  min-height: 34px;
  padding: 4px 9px;
  border: 1px solid #8c7951;
  border-radius: 999px;
  color: var(--gold);
  background: #302b21;
  font-variant-numeric: tabular-nums;
}
.wallet-pill strong { font-size: 16px; }
.screen { display: block; }
#homeScreen:not([hidden]), #roomScreen:not([hidden]) { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

/* Home: two large, direct actions; no nested menus or developer notes. */
.home-screen {
  display: grid;
  gap: 12px;
  width: min(100%, 420px);
  margin-inline: auto;
  padding-top: clamp(20px, 5vh, 42px);
}
.lead { margin: 0 0 5px; text-align: center; font-size: 18px; line-height: 1.45; }
.home-choice, .cta { width: 100%; min-height: 56px; padding: 12px 16px; font-size: 17px; }
.cta-primary { border-color: #ffe1a1; color: #251f13; background: linear-gradient(#f5d58b, #d4aa54); }
.cta-secondary { background: #344a4d; }
.home-note, .room-hint, .status-line {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
  text-align: center;
}

.room-screen h2 { margin: 4px 0 8px; font-size: 21px; }
.room-hint { margin-bottom: 16px; }
.room-code-label { display: block; margin: 18px 0 6px; color: var(--muted); font-size: 14px; }
.room-join-row { display: grid; grid-template-columns: minmax(0, 1fr) 80px; gap: 8px; }
.room-join-row input {
  min-width: 0;
  min-height: var(--tap);
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  background: var(--panel);
}
.room-screen > .text-button { display: block; margin: 12px auto; }
.multi-status-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.status-line:empty { display: none; }
.text-button {
  min-height: var(--tap);
  padding: 6px 10px;
  border: 0;
  color: var(--muted);
  background: transparent;
  text-decoration: underline;
  text-underline-offset: 3px;
}

#gameScreen:not([hidden]) {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
}
.game-topline { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.round-status { margin: 0; color: var(--gold); font-size: 14px; font-weight: 700; }
#comparison:not([hidden]) { display: block; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 8px; }

/* Stake first, then the full army card is one immediate-pick target. */
.stake-card {
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 9px 7px;
  background: var(--panel);
}
.stake-card h3 { display: flex; align-items: baseline; gap: 7px; margin: 0 0 6px; font-size: 14px; }
.stake-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stake-option { min-width: 0; min-height: 44px; padding: 5px 2px; font-size: 14px; font-variant-numeric: tabular-nums; }
.stake-option[aria-pressed="true"] {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
  color: #fff5d9;
  background: #51432b;
}
.stake-hint { margin: 6px 0 2px; color: var(--muted); font-size: 11px; line-height: 1.3; text-align: center; }
.army-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.army-card {
  min-width: 0;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  position: relative;
  gap: 5px;
  overflow: hidden;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  text-align: left;
}
.army-card:active { filter: brightness(1.14); }
.army-red { border-color: #94594e; }
.army-blue { border-color: #4d7288; }
.army-title { display: block; text-align: center; font-size: 16px; font-weight: 800; }
.army-red .army-title, .units-side-red h3 { color: var(--red); }
.army-blue .army-title, .units-side-blue h3 { color: var(--blue); }
.army-preview {
  display: block;
  width: 100%;
  min-height: 88px;
  height: auto;
  aspect-ratio: 5 / 3;
  border-radius: 6px;
  background: #35463d;
  image-rendering: pixelated;
}
.unit-stats {
  display: block;
  min-width: 0;
  color: var(--text);
  font-size: 11px;
  line-height: 1.25;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.army-card[aria-pressed="true"] {
  outline: none;
  box-shadow: inset 0 0 0 3px var(--gold);
}
.army-card:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 3px var(--gold);
}
.army-card[aria-pressed="true"]::after {
  content: "✓";
  position: absolute;
  z-index: 2;
  top: 9px;
  right: 9px;
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border: 2px solid #fff5d9;
  border-radius: 50%;
  color: #251f13;
  background: var(--gold);
  font-size: 20px;
  line-height: 1;
}
.formation-actions { display: flex; justify-content: center; margin-top: 4px; }
.formation-actions .text-button {
  min-width: 160px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  background: var(--panel-raised);
  font-size: 12px;
  text-decoration: none;
}
.compatibility-hooks { display: none !important; }
.prediction-start { margin-top: 6px; font-size: 18px; }

/* The active battle owns the remaining viewport; preserve the canvas ratio and avoid oversized fixed gutters. */
#battle:not([hidden]) {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  gap: 4px;
}
.battle-toolbar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 40px; }
.battle-clock { flex: 0 0 auto; margin: 0; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.reaction-feedback { flex: 1 1 auto; min-width: 0; overflow: hidden; color: var(--gold); font-size: 11px; line-height: 1.2; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
.reaction-feedback:empty { display: none; }
.units-toggle { min-height: 44px; min-width: 70px; padding: 6px 10px; color: #211c13; background: var(--gold); }
.sound-toggle { min-height: 44px; min-width: 44px; padding: 6px 9px; font-size: 12px; }
.field-stage { display: grid; flex: 1; place-items: center; min-height: 0; width: 100%; }
#field {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 480 / 538;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #35463d;
  image-rendering: pixelated;
  object-fit: contain;
}
.battle-controls { display: grid; grid-template-columns: repeat(6, minmax(44px, 1fr)); gap: 4px; }
.control-button { min-width: 44px; min-height: 44px; padding: 4px 2px; font-size: 10px; line-height: 1.1; white-space: normal; }

/* Result feedback is readable, brief, and normally advances without a tap. */
.result-panel {
  flex: 0 1 auto;
  min-height: max-content;
  max-height: 100%;
  overflow-y: auto;
  width: min(100%, 430px);
  margin: clamp(10px, 2vh, 20px) auto 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  background: var(--panel);
  text-align: center;
}
.result-title { margin: 0 0 5px; font-size: 21px; }
.result-summary { margin: 0 0 6px; font-size: 13px; line-height: 1.4; white-space: pre-line; }
.score-line { margin: 4px 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.score-separator { padding-inline: 4px; }
.result-next { margin-top: 8px; }

/* One explicit UNITS action opens a read-only overlay; no trait accordion. */
.units-panel {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: grid;
  place-items: center;
  padding-block-start: max(10px, env(safe-area-inset-top, 0px), var(--gravity-host-top-inset, 0px));
  padding-inline: 12px;
  padding-block-end: max(10px, env(safe-area-inset-bottom, 0px), var(--gravity-host-bottom-inset, 0px));
  background: rgb(0 0 0 / 72%);
}
.units-panel:not([hidden]) { display: grid; }
.units-dialog {
  width: min(100%, 480px);
  max-height: 100%;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  background: var(--page);
  box-shadow: 0 12px 36px rgb(0 0 0 / 45%);
}
.units-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.units-heading h2 { margin: 0; font-size: 18px; }
.units-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.units-side { min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.units-side h3 { margin: 0 0 6px; font-size: 15px; text-align: center; }
.units-stat-list { font-size: 11px; line-height: 1.35; }
.units-note { margin: 9px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
.pause-dialog { display: grid; gap: 8px; width: min(100%, 320px); text-align: center; }
.pause-dialog h2 { margin: 0 0 4px; font-size: 20px; }
.pause-dialog .cta { min-height: 56px; }
.pause-dialog .text-button { width: 100%; }

@media (max-width: 350px) {
  #app { padding-inline: 8px; }
  .army-grid { gap: 6px; }
  .army-card { padding: 6px; }
  .unit-stats { font-size: 11px; }
  .control-button { font-size: 10px; }
}
@media (max-height: 640px) {
  .app-header { margin-bottom: 5px; }
  .home-screen { padding-top: 12px; gap: 8px; }
  .army-card { gap: 4px; }
  .battle-toolbar { min-height: 36px; }
}

/* On wide desktop screens, give the battlefield the remaining height and move
   controls to a side rail instead of compressing their tap targets. */
@media (min-width: 900px) and (min-height: 640px) {
  #app { width: min(100%, 980px); padding-inline: 24px; }
  .app-header { min-height: 38px; margin-bottom: 4px; padding-bottom: 4px; }
  #gameScreen[data-field-view="true"] { position: relative; }
  #gameScreen[data-field-view="true"] > .game-topline {
    position: absolute;
    z-index: 4;
    inset: 0 0 auto;
    min-height: 36px;
    pointer-events: none;
  }
  #gameScreen[data-field-view="true"] > .game-topline > * { pointer-events: auto; }
  #gameScreen[data-field-view="true"] #battle:not([hidden]) { position: relative; gap: 0; }
  #gameScreen[data-field-view="true"] .battle-toolbar {
    position: absolute;
    z-index: 3;
    inset: 38px max(0px, calc((100% - 800px) / 2)) auto auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 4px;
    transform: none;
    width: 76px;
    min-height: 0;
    pointer-events: auto;
  }
  #gameScreen[data-field-view="true"] .battle-toolbar > * { pointer-events: auto; }
  #gameScreen[data-field-view="true"] .battle-clock { width: 100%; text-align: center; white-space: nowrap; }
  #gameScreen[data-field-view="true"] .reaction-feedback { flex: 0 1 auto; width: 100%; max-width: 76px; text-align: center; }
  #gameScreen[data-field-view="true"] .units-toggle { width: 100%; min-width: 0; }
  #gameScreen[data-field-view="true"] .sound-toggle,
  #gameScreen[data-field-view="true"] .reaction-toggle { align-self: center; }
  #gameScreen[data-field-view="true"] #formationBack { width: 100%; padding-inline: 4px; }
  /* Keep the popup inside the viewport after the toolbar moves to the right rail. */
  #gameScreen[data-field-view="true"] .reaction-bar {
    left: auto;
    right: 0;
    transform: translateY(-50%);
  }
  #gameScreen[data-field-view="true"] .field-stage {
    position: absolute;
    inset: 0;
    width: min(100%, 600px);
    height: 100%;
    margin-inline: auto;
  }
  #gameScreen[data-field-view="true"] .battle-controls {
    position: absolute;
    z-index: 4;
    top: auto;
    right: max(0px, calc((100% - 800px) / 2));
    bottom: 12px;
    transform: none;
    grid-template-columns: minmax(64px, 1fr);
    gap: 6px;
    width: 76px;
    padding: 4px;
    border: 1px solid rgb(195 190 172 / 35%);
    border-radius: 10px;
    background: rgb(17 26 32 / 78%);
  }
  #gameScreen[data-field-view="true"] .control-button { width: 100%; font-size: 11px; }
}
@media (max-width: 355px) {
  #app { padding-inline: 8px; }
}
@media (max-width: 299px) {
  .battle-controls { grid-template-columns: repeat(4, minmax(44px, 1fr)); }
}


.result-progress {height:3px;width:min(100%,220px);margin:12px auto 0;background:#ffffff22;overflow:hidden;border-radius:2px}
.result-progress span {display:block;height:100%;background:var(--gold,#e6c56b);transform-origin:left center}


/* Optional reactions share the existing toolbar row; the 44px choices overlay that row. */
.reaction-toggle { flex: 0 0 44px; min-width: 44px; min-height: 44px; padding: 4px 2px; font-size: 11px; }
.reaction-backdrop {
  position: fixed;
  z-index: 32;
  inset: 0;
  border: 0;
  border-radius: 0;
  padding: 0;
  background: transparent;
  cursor: default;
  touch-action: manipulation;
}
.reaction-backdrop[hidden], .reaction-bar[hidden] { display: none !important; }
.reaction-bar {
  position: absolute;
  z-index: 35;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  grid-template-columns: repeat(4, minmax(44px, 1fr));
  gap: 2px;
  width: min(248px, calc(100vw - 16px));
  height: 44px;
  padding: 0;
  outline: 1px solid var(--line);
  outline-offset: -1px;
  border-radius: 10px;
  background: var(--panel);
  box-shadow: 0 6px 18px rgb(0 0 0 / 45%);
}
.reaction-bar button { min-width: 44px; min-height: 44px; padding: 3px 2px; font-size: 11px; line-height: 1; white-space: nowrap; }
/* Outside taps are swallowed by the backdrop while only the entry and choices remain interactive. */
#battle[data-reaction-open="true"] .battle-toolbar { z-index:34; pointer-events: none; }
#battle[data-reaction-open="true"] #reaction-bar { pointer-events: auto; }

@media (min-width: 900px) and (min-height: 640px) {
  #gameScreen[data-field-view="true"] #battle[data-reaction-open="true"] .battle-toolbar { z-index: 34; }
}

@supports (height: 100dvh) { :root { --app-viewport-default: 100dvh; } }

/* Personal result stays above the final field; no blank transition or extra tap. */
#gameScreen[data-personal-result="true"] { position:relative; }
#gameScreen[data-personal-result="true"] #resultPanel { position:absolute; z-index:5; bottom:8px; left:12px; right:12px; width:auto; margin:0; padding:12px 16px; background:rgba(26,35,32,.96); border:2px solid #85775b; }
#resultPanel[data-outcome="hit"] { border-color:#e7c777!important; }
#resultPanel[data-outcome="hit"] #message { color:#ffe3a0; }
.result-winner { margin:0 0 4px; font-size:12px; color:#c5c3ad; }
#breakdown { font-variant-numeric:tabular-nums; }
.result-ranking { font-size:12px; margin:6px 0; }
.checkpoint-net { margin:2px 0 0; color:var(--muted); font-size:12px; line-height:1.2; font-variant-numeric:tabular-nums; }

#gameScreen[data-personal-result="true"] #resultPanel { width:min(calc(100% - 24px),430px); left:0; right:0; margin-inline:auto; padding:8px 12px; }
#gameScreen[data-personal-result="true"] #message { font-size:20px; line-height:1.15; margin:3px 0; }
#gameScreen[data-personal-result="true"] #breakdown { font-size:22px; line-height:1.2; margin:4px 0; }
#gameScreen[data-personal-result="true"] .result-progress { margin-top:4px; }

#gameScreen[data-personal-result="true"] #resultPanel { max-height:calc(100% - 16px); }

.extension-choices {display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.extension-choices small {grid-column:1/-1;font-size:11px;color:#c5c3ad;text-align:center}
</style></head><body><div id="bootStatus" role="status" style="padding:12px;background:#3c3224;color:#fff4d1;font:14px/1.5 system-ui">ゲームを起動しています。プレビューでは操作できない場合があります。この表示が残る場合は、案内された試遊 URL から開いてください。</div>
<noscript><p>この表示環境では JavaScript が無効です。ゲームを実行できるブラウザで HTML を開いてください。</p></noscript>
<script>
(function () {
  var box = document.getElementById('bootStatus');
  window.addEventListener('error', function (event) {
    box.hidden = false;
    box.textContent = 'ゲームを開始できませんでした: ' + (event.message || '実行エラー') + '（行 ' + (event.lineno || '?') + '）。この表示をお知らせください。';
  });
  window.__gameBootComplete = function () { box.hidden = true; };
}());
</script>
<!-- Candidate UI shell only. Keep battle, wallet, room, and sprite logic in the existing controller. -->
<main id="app">
  <header class="app-header">
    <h1>どっちが勝つ？</h1>
    <div class="wallet-pill" aria-label="ゲーム内通貨">
      <strong id="balance">100 G</strong>
    </div>
  </header>

  <section id="homeScreen" class="screen home-screen" aria-labelledby="homeTitle">
    <p id="homeTitle" class="lead">勝つ方を選ぼう！</p>
    <button id="soloStart" class="home-choice cta-primary" type="button">ひとりで遊ぶ</button>
    <button id="showMultiplayer" class="home-choice cta-secondary" type="button">みんなで遊ぶ</button>
    <p class="home-note">予想無料</p>
  </section>

  <button id="mockRoom" type="button" hidden aria-hidden="true" tabindex="-1"></button>

  <section id="roomScreen" class="screen room-screen" hidden aria-labelledby="roomTitle">
    <h2 id="roomTitle">みんなで遊ぶ</h2>
    <p class="room-hint">部屋を作るか、コードで参加。</p>
    <button id="createRoom" class="cta cta-primary" type="button">部屋をつくる</button>
    <button id="beginRound" class="cta cta-primary" type="button" hidden>第1戦へ</button>
    <label class="room-code-label" for="roomId">コード入力</label>
    <div class="room-join-row">
      <input id="roomId" type="text" autocomplete="off" maxlength="128" placeholder="部屋コード" />
      <button id="joinRoom" class="cta cta-secondary" type="button">参加</button>
    </div>
    <button id="backHome" class="text-button" type="button">戻る</button>
  </section>

  <div id="multiStatusRow" class="multi-status-row" hidden>
    <p id="roomStatus" class="status-line" aria-live="polite"></p>
    <button id="exitRoom" class="text-button" type="button" hidden>退出</button>
  </div>

  <section id="gameScreen" class="screen game-screen" hidden aria-label="ゲーム">
    <div class="game-topline">
      <p id="status" class="round-status" aria-live="polite">第 1 / 20 戦</p>
    </div>
    <h2 id="phaseTitle" class="sr-only"></h2>

    <section id="comparison" class="comparison" aria-label="対戦予想">

      try { node.disconnect(); } catch (_) { /* already disconnected */ }
      nodes.delete(node);
    }

    function safeResume() {
      if (!context) return Promise.resolve(false);
      if (context.state === 'running') {
        if (resumePending) { resumeGeneration++; resumePending = false; resumePromise = null; drainCueQueue(); }
        return Promise.resolve(true);
      }
      if (resumePromise) return resumePromise;
      try {
        const p = context.resume();
        const generation = ++resumeGeneration;
        resumePending = true;
        resumePromise = Promise.resolve(p).then(() => {
          if (generation !== resumeGeneration) return false;
          resumePending = false; resumePromise = null;
          if (context?.state === 'running') { syncAmbient(); drainCueQueue(); return true; }
          return false;
        }, () => {
          if (generation === resumeGeneration) { resumePending = false; resumePromise = null; queuedCues = []; }
          return false;
        });
        return resumePromise;
      } catch (_) { resumeGeneration++; resumePending = false; resumePromise = null; queuedCues = []; return Promise.resolve(false); }
    }

    function ensureContext(event) {
      if (!trusted(event)) return false;
      if (context) {
        safeResume();
        syncAmbient();
        return true;
      }
      if (typeof Context !== 'function') return false;
      try {
        context = new Context();
        specialSfx = typeof globalThis.createOriginalSpecialSfxBank === 'function'
          ? globalThis.createOriginalSpecialSfxBank(context) : null;
        master = managed(context.createGain());
        master.gain.value = muted || suppressed ? 0 : 0.42;
        master.connect(context.destination);

        // Fixed private pseudo-noise is intentionally independent of Math.random
        // and the game's seeded simulation stream.
        const length = Math.max(128, Math.floor(context.sampleRate * NOISE_SECONDS));
        noiseBuffer = context.createBuffer(1, length, context.sampleRate);
        const channel = noiseBuffer.getChannelData(0);
        let seed = 0x6d2b79f5;
        for (let i = 0; i < length; i++) {
          seed = (Math.imul(seed ^ (seed >>> 15), 1 | seed) + 0x6d2b79f5) | 0;
          const white = ((seed >>> 0) / 2147483648) - 1;
          channel[i] = white * (0.72 + 0.28 * Math.cos(2 * Math.PI * i / length));
        }
        context.onstatechange = () => {
          if (context && context.state === 'running') { syncAmbient(); drainCueQueue(); }
        };
        safeResume();
        syncAmbient();
        return true;
      } catch (_) {
        disposeContext();
        return false;
      }
    }

    function disposeContext() {
      for (const voice of Array.from(voices)) stopVoice(voice);
      for (const n of ambientNodes) releaseNode(n);
      ambientNodes = [];
      ambientGain = null;
      ambientDuckGain = null;
      specialSfx = null;
      if (master) releaseNode(master);
      master = null;
      try { context?.close?.(); } catch (_) { /* unavailable/closed */ }
      context = null;
      noiseBuffer = null;
      resumeGeneration++; resumePending = false; resumePromise = null; queuedCues = [];
    }

    function setParam(param, value, time, glide = 0.035) {
      if (!param) return;
      try {
        param.cancelScheduledValues(time);
        param.setTargetAtTime(value, time, glide);
      } catch (_) { try { param.value = value; } catch (_) { /* no-op */ } }
    }

    function setImmediately(param, value, time = now()) {
      if (!param) return;
      try {
        param.cancelScheduledValues(time);
        param.setValueAtTime(value, time);
      } catch (_) { try { param.value = value; } catch (_) { /* no-op */ } }
    }

    function updateMuteButton() {
      if (!muteButton) return;
      try {
        // Keep the visual control minimal; state and action remain accessible.
        muteButton.textContent = '音';
        muteButton.setAttribute('aria-label', muted ? 'サウンドをオンにする' : 'サウンドをミュート');
        muteButton.setAttribute('aria-pressed', String(muted));
        muteButton.setAttribute('title', muted ? 'サウンドをオン' : 'サウンドをミュート');
      } catch (_) { /* tolerate simple test doubles */ }
    }

    function setMuted(value, event) {
      const next = !!value;
      if (next === muted) {
        if (!next && trusted(event)) ensureContext(event);
        return muted;
      }
      if (!next && trusted(event)) ensureContext(event);
      muted = next;
      if (muted) queuedCues = [];
      if (master) setParam(master.gain, muted || suppressed ? 0 : 0.42, now(), 0.018);
      syncAmbient();
      updateMuteButton();
      return muted;
    }

    function toggleMuted(event) {
      setMuted(!muted, event);
      return muted;
    }

    function enabled() {
      return !!context && context.state === 'running' && !muted && visible && !paused && !suppressed;
    }

    function mayPlayOrQueue() {
      return !!context && !muted && visible && !paused && !suppressed;
    }

    function ambienceWanted() {
      return !!context && phase === 'battle' && !muted && visible && !paused && !suppressed;
    }

    function makeAmbient() {
      if (!context || ambientGain || nodeCount() + 8 > MAX_NODES) return;
      try {
        ambientGain = managed(context.createGain());
        ambientGain.gain.value = 0;
        ambientDuckGain = managed(context.createGain());
        ambientDuckGain.gain.value = 1;
        ambientGain.connect(ambientDuckGain);
        ambientDuckGain.connect(master);
        ambientNodes.push(ambientGain, ambientDuckGain);
        // A quiet two-note fifth with no beat loop or external asset: a soft
        // room-tone bed, not another foreground melody.
        for (const [hz, amp] of [[55, 0.013], [82.41, 0.0075], [110, 0.0025]]) {
          const osc = managed(context.createOscillator());
          const level = managed(context.createGain());
          osc.type = 'sine';
          osc.frequency.value = hz;
          level.gain.value = amp;
          osc.connect(level); level.connect(ambientGain); osc.start();
          ambientNodes.push(osc, level);
        }
      } catch (_) {
        for (const n of ambientNodes) releaseNode(n);
        ambientNodes = [];
        ambientGain = null;
        ambientDuckGain = null;
      }
    }

    function syncAmbient() {
      if (!context) return;
      makeAmbient();
      if (!ambientGain) return;
      const wanted = ambienceWanted() && context.state === 'running';
      ambientLevel = wanted ? 1 : 0;
      setParam(ambientGain.gain, wanted ? 1 : 0, now(), wanted ? 0.65 : 0.18);
    }

    function unlockFromGesture(event) {
      const ok = ensureContext(event);
      if (ok) syncAmbient();
      return ok;
    }

    function duckAmbient(depth = 0.76, duration = 0.28) {
      if (!enabled() || !ambientDuckGain) return;
      const t = now();
      if (t - lastDuckAt < 0.045) return;
      lastDuckAt = t;
      try {
        const p = ambientDuckGain.gain;
        p.cancelScheduledValues(t);
        p.setValueAtTime(depth, t);
        p.linearRampToValueAtTime(1, t + duration);
      } catch (_) { /* absent automation is non-fatal */ }
    }

    function startVoice(duration) {
      if (!enabled() || voices.size >= MAX_VOICES || nodeCount() + 2 > MAX_NODES) return null;
      let bus;
      try {
        bus = managed(context.createGain());
        bus.gain.value = 0;
        bus.connect(master);
      } catch (_) { if (bus) releaseNode(bus); return null; }
      const voice = { bus, pending: 0, stopped: false, nodes: new Set() };
      voices.add(voice);
      const t = now() + 0.006;
      try {
        bus.gain.setValueAtTime(0.0001, t);
        bus.gain.linearRampToValueAtTime(0.9, t + 0.008);
        bus.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.025, duration));
      } catch (_) { bus.gain.value = 0.5; }
      return voice;
    }

    function endVoice(voice) {
      if (!voice || voice.stopped || voice.pending > 0) return;
      voice.stopped = true;
      for (const node of voice.nodes) releaseNode(node);
      releaseNode(voice.bus);
      voices.delete(voice);
    }

    function stopVoice(voice) {
      if (!voice || voice.stopped) return;
      voice.stopped = true;
      for (const node of voice.nodes) {
        try { node.stop(); } catch (_) { /* ended already */ }
        releaseNode(node);
      }
      releaseNode(voice.bus);
      voices.delete(voice);
    }

    function attachSource(voice, source, delay, duration, stopTail = 0.02, output = voice?.bus) {
      if (!voice || !source) return false;
      let counted = false;
      try {
        managed(source);
        voice.nodes.add(source);
        source.onended = () => {
          if (!counted) return;
          voice.pending--;
          releaseNode(source);
          voice.nodes.delete(source);
          endVoice(voice);
        };
        const at = now() + 0.008 + delay;
        source.connect(output);
        source.start(at);
        source.stop(at + duration + stopTail);
        voice.pending++;
        counted = true;
        return true;
      } catch (_) {
        if (counted) voice.pending--;
        try { source.stop(); } catch (_) { /* start may not have happened */ }
        releaseNode(source);
        voice.nodes.delete(source);
        endVoice(voice);
        return false;
      }
    }

    function addTone(voice, freq, duration, amplitude, type = 'triangle', delay = 0, bend = 0) {
      if (!voice || nodeCount() + 2 > MAX_NODES) return;
      let osc = null, level = null;
      try {
        osc = managed(context.createOscillator());
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now() + 0.008 + delay);
        if (bend) osc.frequency.linearRampToValueAtTime(bend, now() + 0.008 + delay + duration);
        // Keep partial levels independent but within the single voice envelope.
        level = managed(context.createGain());
        level.gain.value = amplitude;
        level.connect(voice.bus);
        // Track the intermediate level node and release it with the source.
        voice.nodes.add(level);
        if (!attachSource(voice, osc, delay, duration, 0.02, level)) {
          releaseNode(level); voice.nodes.delete(level);
        }
        else {
          const prior = osc.onended;
          osc.onended = () => { try { prior?.(); } finally { releaseNode(level); voice.nodes.delete(level); } };
        }
      } catch (_) {
        if (osc) { releaseNode(osc); voice.nodes.delete(osc); }
        if (level) { releaseNode(level); voice.nodes.delete(level); }
      }
    }

    function addNoise(voice, duration, amplitude, cutoff = 1400, delay = 0) {
      if (!voice || !noiseBuffer || nodeCount() + 3 > MAX_NODES) return;
      let source = null, filter = null, level = null;
      try {
        source = managed(context.createBufferSource());
        source.buffer = noiseBuffer;
        filter = managed(context.createBiquadFilter());
        filter.type = 'lowpass'; filter.frequency.value = cutoff;
        level = managed(context.createGain()); level.gain.value = amplitude;
        filter.connect(level); level.connect(voice.bus);
        voice.nodes.add(filter); voice.nodes.add(level);
        if (!attachSource(voice, source, delay, duration, 0.005, filter)) {
          releaseNode(filter); releaseNode(level); voice.nodes.delete(filter); voice.nodes.delete(level);
        } else {
          const prior = source.onended;
          source.onended = () => { try { prior?.(); } finally {
            releaseNode(filter); releaseNode(level); voice.nodes.delete(filter); voice.nodes.delete(level);
          } };
        }
      } catch (_) {
        for (const n of [source, filter, level]) if (n) { releaseNode(n); voice.nodes.delete(n); }
      }
    }

    function drainCueQueue() {
      if (!enabled()) { queuedCues = []; return; }
      const pending = queuedCues.splice(0);
      const t = wallNow();
      for (const cue of pending) {
        if (t - cue.queuedAt > 0.7) continue;
        if (cue.guard?.battleId && cue.guard.battleId !== currentBattle) continue;
        if (cue.guard?.phase && cue.guard.phase !== phase) continue;
        playCue(cue.kind, cue.intensity, cue.guard, true);
      }
    }

    function playCue(kind, intensity = 1, guard = null, fromQueue = false) {
      const special = { golem: 'heavy', storm: 'zap', bomb: 'blast', drake: 'metal' };
      if (special[kind]) {
        if (specialSfx) return playSpecialCue(kind, intensity);
        kind = special[kind]; // graceful fallback if the bank did not load
      }
      const specs = {
        select: { duration: 0.065, tones: [[620, 0.17, 0.024, 'triangle', 0, 455]], noise: [0.024, 0.18, 2200] },
        start:  { duration: 0.19, tones: [[146.8, 0.16, 0.025, 'triangle'], [220, 0.15, 0.012, 'sine', 0.035]], noise: [0.075, 0.13, 680] },
        hit:    { duration: 0.105, tones: [[96, 0.10, 0.028, 'triangle']], noise: [0.06, 0.26, 1250] },
        metal:  { duration: 0.09, tones: [[390, 0.075, 0.019, 'triangle', 0, 260]], noise: [0.045, 0.17, 2450] },
        magic:  { duration: 0.13, tones: [[440, 0.11, 0.018, 'sine', 0, 370], [660, 0.10, 0.008, 'sine', 0.018]], noise: [0.035, 0.06, 3400] },
        heavy:  { duration: 0.16, tones: [[72, 0.15, 0.034, 'triangle', 0, 54]], noise: [0.095, 0.30, 760] },
        blast:  { duration: 0.22, tones: [[58, 0.20, 0.04, 'sine', 0, 43], [117, 0.13, 0.013, 'triangle']], noise: [0.14, 0.34, 620] },
        zap:    { duration: 0.14, tones: [[740, 0.05, 0.011, 'sine'], [988, 0.045, 0.009, 'sine', 0.05], [587, 0.065, 0.007, 'triangle', 0.095]] },
        heal:   { duration: 0.30, tones: [[523.25, 0.25, 0.009, 'sine'], [659.25, 0.22, 0.007, 'sine', 0.045], [783.99, 0.19, 0.005, 'sine', 0.09]] },
        emerge: { duration: 0.12, tones: [[82, 0.11, 0.018, 'triangle', 0, 115]], noise: [0.06, 0.13, 520] },
        win:    { duration: 0.48, tones: [[392, 0.40, 0.012, 'sine'], [493.88, 0.38, 0.010, 'sine', 0.045], [587.33, 0.34, 0.009, 'sine', 0.09]] },
        loss:   { duration: 0.38, tones: [[392, 0.18, 0.010, 'sine', 0, 329.63], [293.66, 0.24, 0.009, 'sine', 0.12, 246.94]] },
        draw:   { duration: 0.25, tones: [[392, 0.20, 0.008, 'sine'], [392, 0.20, 0.006, 'sine', 0.07]] },
        // Reward cadence: a compact warm triad, then two tiny inharmonic
        // glints. It reads as credited game coins without a cash-register cue.
        predictionWin: { duration: 0.34, tones: [
          [587.33, 0.23, 0.14, 'sine'], [739.99, 0.22, 0.13, 'sine', 0.035], [880, 0.20, 0.12, 'sine', 0.070],
          [1318.5, 0.085, 0.10, 'sine', 0.115, 1175], [1975.5, 0.075, 0.06, 'sine', 0.115, 1760],
          [1480, 0.070, 0.075, 'sine', 0.195, 1318.5], [2220, 0.060, 0.045, 'sine', 0.195, 1975.5]
        ] },
        // Staked miss: a short falling cadence with a soft, non-percussive
        // metallic drop. A no-stake miss uses a neutral tick, never this cue.
        predictionLoss: { duration: 0.29, tones: [
          [392, 0.15, 0.060, 'sine', 0, 329.63], [293.66, 0.15, 0.050, 'sine', 0.055, 246.94],
          [1174.7, 0.070, 0.040, 'sine', 0.115, 784], [1760, 0.060, 0.025, 'sine', 0.115, 1175]
        ] },
        // Correctly signals a miss without implying a deduction when stake=0.
        noStakeMiss: { duration: 0.12, tones: [[440, 0.09, 0.028, 'triangle', 0, 392]] },
        resultStampWin: { duration: 0.12, tones: [[330, 0.085, 0.055, 'triangle', 0, 392], [659.25, 0.075, 0.035, 'sine', 0.014]], noise: [0.028, 0.075, 1300] },
        resultStampLoss: { duration: 0.10, tones: [[247, 0.070, 0.038, 'triangle', 0, 220]], noise: [0.024, 0.055, 850] },
        resultStampNeutral: { duration: 0.08, tones: [[392, 0.055, 0.026, 'sine']] },
        resultCoin: { duration: 0.22, tones: [[1318.5, 0.095, 0.10, 'sine', 0, 1175], [1975.5, 0.085, 0.055, 'sine', 0, 1760], [1480, 0.080, 0.072, 'sine', 0.072, 1318.5], [2220, 0.070, 0.040, 'sine', 0.072, 1975.5]] },
        resultDebit: { duration: 0.20, tones: [[392, 0.13, 0.060, 'sine', 0, 329.63], [293.66, 0.13, 0.050, 'sine', 0.060, 246.94], [1174.7, 0.075, 0.036, 'sine', 0.105, 784], [1760, 0.065, 0.020, 'sine', 0.105, 1175]] }
      };
      const spec = specs[kind];
      if (!spec || !mayPlayOrQueue()) return false;
      if (!enabled()) {
        if (!fromQueue && resumePending && queuedCues.length < 4) {
          queuedCues.push({ kind, intensity, guard, queuedAt: wallNow() });
          return true;
        }
        return false;
      }
      const volume = clamp(intensity, 0.48, 1);
      const voice = startVoice(spec.duration);
      if (!voice) return false;
      // Foreground sounds stay quiet under the ambient master bus.
      try { voice.bus.gain.setValueAtTime(0.0001, now() + 0.006); } catch (_) { /* fallback below */ }
      for (const [freq, dur, amp, type, delay, bend] of (spec.tones || []))
        addTone(voice, freq, dur, amp * volume, type, delay || 0, bend || 0);
      if (spec.noise) addNoise(voice, spec.noise[0], spec.noise[1] * volume, spec.noise[2], spec.noise[3] || 0);
      if (voice.pending === 0) endVoice(voice);
      return true;
    }

    function playSpecialCue(kind, intensity = 1) {
      if (!specialSfx || !enabled() || voices.size >= MAX_VOICES || nodeCount() + 2 > MAX_NODES) return false;
      let buffer;
      try { buffer = specialSfx.getBuffer(kind); } catch (_) { return false; }
      if (!buffer || !(buffer.duration > 0)) return false;
      const voice = startVoice(buffer.duration);
      if (!voice) return false;
      const t = now() + 0.008;
      const amplitude = ({ golem: 0.40, storm: 0.38, bomb: 0.36, drake: 0.37 })[kind] * clamp(intensity, 0.55, 1);
      try {
        voice.bus.gain.cancelScheduledValues(t);
        voice.bus.gain.setValueAtTime(amplitude, t);
      } catch (_) { voice.bus.gain.value = amplitude; }
      try {
        const source = managed(context.createBufferSource());
        source.buffer = buffer;
        if (!attachSource(voice, source, 0, buffer.duration, 0.02)) return false;
      } catch (_) { endVoice(voice); return false; }
      if (voice.pending === 0) endVoice(voice);
      duckAmbient(kind === 'bomb' ? 0.72 : 0.77, kind === 'bomb' ? 0.34 : 0.25);
      return true;
    }

    function playSelection(event) {
      if (trusted(event)) unlockFromGesture(event);
      if (!mayPlayOrQueue()) return false;
      const t = wallNow();
      if (t - selectionLastAt < 0.12) return false;
      selectionLastAt = t;
      return playCue('select', 0.8);
    }

    function beginBattle(battleId, event) {
      const key = keyOf(battleId);
      if (!key) return false;
      if (trusted(event)) unlockFromGesture(event);
      if (currentBattle === key) {
        if (finished.has(key)) return false;
        phase = 'battle'; syncAmbient();
        return false; // duplicate transition/reconnect: never replay the start cue
      }
      currentBattle = key;
      phase = 'battle'; paused = false;
      const isNew = remember(started, startedOrder, key, MAX_BATTLE_KEYS);
      syncAmbient();
      if (isNew) playCue('start', 1, { battleId: key, phase: 'battle' });
      return isNew;
    }

    function finishBattle(battleId, winner) {
      const key = keyOf(battleId);
      if (!key || key !== currentBattle || finished.has(key)) return false;
      remember(finished, finishedOrder, key, MAX_BATTLE_KEYS);
      phase = 'result';
      syncAmbient();
      // `winner` is a presentation result (0/1/null), not an input to combat.
      playCue(winner === null || winner === undefined ? 'draw' : 'win', 1, { battleId: key, phase: 'result' });
      return true;
    }

    function rememberResultMeta(key, meta) {
      resultMeta.set(key, meta);
      resultMetaOrder.push(key);
      while (resultMetaOrder.length > MAX_BATTLE_KEYS) resultMeta.delete(resultMetaOrder.shift());
    }

    function rememberResultStage(key, stage) {
      const stageKey = key + ':' + stage;
      if (!remember(resultStageKeys, resultStageOrder, stageKey, MAX_BATTLE_KEYS * 3)) return false;
      return true;
    }

    function finishBattleForChoice(battleId, won, meta = {}) {
      const key = keyOf(battleId);
      if (!key || key !== currentBattle || finished.has(key)) return false;
      remember(finished, finishedOrder, key, MAX_BATTLE_KEYS);
      phase = 'result';
      syncAmbient();
      // The caller supplies only this player's accepted settlement context.
      // Missing/invalid stake preserves the prior API's result cadences.
      const stake = Number.isSafeInteger(meta?.stake) && meta.stake >= 0 ? meta.stake : null;
      const result = { won: won === true || won === false ? won : null, stake, deferred: meta?.deferStages === true };
      rememberResultMeta(key, result);
      if (result.deferred) return true;
      const cue = result.won === null ? 'draw' : result.won ? 'predictionWin' :
        (stake === 0 ? 'noStakeMiss' : stake > 0 ? 'predictionLoss' : 'loss');
      playCue(cue, 1, { battleId: key, phase: 'result' });
      return true;
    }

    function playResultStage(battleId, stage, detail = {}) {
      const key = keyOf(battleId), result = resultMeta.get(key);
      if (!key || key !== currentBattle || phase !== 'result' || !result?.deferred) return false;
      if (!['stamp', 'delta', 'balance'].includes(stage) || resultStageKeys.has(key + ':' + stage)) return false;
      if (stage === 'delta' && !resultStageKeys.has(key + ':stamp')) return false;
      if (stage === 'balance' && !resultStageKeys.has(key + ':delta')) return false;
      if (stage === 'delta') {
        if (!Number.isSafeInteger(detail?.delta)) return false;
        const delta = detail.delta;
        if (result.won === true && delta < 0 || result.won === false && delta > 0 ||
            result.won === false && result.stake === 0 && delta < 0 || result.won === null && delta !== 0) return false;
      }
      if (!rememberResultStage(key, stage)) return false;

      if (stage === 'stamp') {
        const cue = result.won === true ? 'resultStampWin' : result.won === false && result.stake > 0 ? 'resultStampLoss' : 'resultStampNeutral';
        return playCue(cue, result.won === true && result.stake > 0 ? 0.88 : 0.65, { battleId: key, phase: 'result' });
      }
      if (stage === 'delta') {
        const delta = detail.delta;
        if (delta === 0) return true; // no actual account movement (e.g. wrong guess at 0G)
        const stake = Number.isSafeInteger(detail.stake) && detail.stake >= 0 ? detail.stake : result.stake;
        const intensity = delta > 0
          ? (stake > 0 ? clamp(0.68 + Math.min(stake, 50) * 0.005, 0.68, 0.93) : 0.52)
          : clamp(0.58 + Math.min(Math.abs(delta), 50) * 0.004, 0.58, 0.80);
        return playCue(delta > 0 ? 'resultCoin' : 'resultDebit', intensity, { battleId: key, phase: 'result' });
      }
      // The UI has reached the final balance settle; intentionally silent to
      // avoid a third reward sound over the actual delta and its number roll.
      return true;
    }

    function hitCue(sourceKind) {
      const k = String(sourceKind || '').toLowerCase();
      if (k === 'cannon' || k === 'archer') return 'metal';
      if (k.includes('mage') || k === 'wraith' || k === 'healer') return 'magic';
      if (k === 'golem' || k === 'boar' || k === 'bombbug') return 'heavy';
      return 'hit';
    }

    function ingestCombatEvents(events, meta = {}) {
      const key = keyOf(meta.battleId || currentBattle);
      if (!key || key !== currentBattle || phase !== 'battle' || !enabled()) return 0;
      if (meta.tick !== undefined && meta.tick !== null) {
        const batchKey = key + ':' + String(meta.tick);
        if (!remember(batches, batchOrder, batchKey, MAX_BATCHES)) return 0;

EFFECT_META.chain_arc={frames:6,fps:25};
for(const [kind,name] of [['ground_slam','stone_contact'],['bomb_explosion','bomb_open_burst'],['drake_claw','drake_claw_contact'],['chain_contact','chain_contact']])EFFECT_META[kind].runtimeFile='assets/hero-fx/'+name+'.png';
const effectImages={};if(typeof Image!=='undefined')for(const k of Object.keys(EFFECT_ASSETS)){const img=new Image();effectImages[k]=img;img.src=EFFECT_ASSETS[k];}
// Presentation-only effects. Only accepted simulation events create transient cues.
let activeEffects=[],newEffects=[],effectClockTick=0,lowEffects=false;
const EFFECT_CAPS={ground_slam:4,magic_sparkle:4,muzzle_flash:6,drake_claw:6,bomb_explosion:3,chain_arc:6};
function admitEffect(kind,x,y,face=1,tick=effectClockTick,targetX=x,targetY=y){
 const meta=EFFECT_META[kind];if(!meta||kind==='arrow')return;
 activeEffects=activeEffects.filter(f=>tick-f.tick<EFFECT_META[f.kind].frames/EFFECT_META[f.kind].fps*60);
 if(kind==='hit_spark'&&activeEffects.some(f=>f.kind===kind&&tick-f.tick<5&&Math.hypot(f.x-x,f.y-y)<=12))return;
 const essential=kind==='burrow_warning',cap=essential?24:(lowEffects?12:24);if(essential&&activeEffects.length>=cap){const expendable=activeEffects.findIndex(f=>f.kind!=='burrow_warning');if(expendable>=0)activeEffects.splice(expendable,1);}
 if(activeEffects.length>=cap||activeEffects.filter(f=>f.kind===kind).length>=(EFFECT_CAPS[kind]||24))return;
 const f={kind,x,y,face:face<0?-1:1,tick,targetX,targetY};activeEffects.push(f);newEffects.push(f);
}
function consumeCombatEvents(events){
 newEffects=[];effectClockTick=Math.round(elapsed*60);
 for(const event of events||[]){
  const kind=event.type,actor=units.find(u=>String(u.token??u.id)===String(event.sourceToken??event.parentToken)),face=actor?visualFor(actor).face:1;
  if(['cadence_delayed','parry_block','poison_cloud','poison_applied','ward_block'].includes(kind))admitEffect(kind,event.x,event.y,face,effectClockTick,event.x+(event.radius||0),event.y);
  if(kind==='charge_impact')admitEffect('charge_trail',event.fromX??event.x,event.fromY??event.y,face,effectClockTick,event.targetX??event.x,event.targetY??event.y);
  if(kind==='bomb_explode')admitEffect('bomb_explosion',event.x,event.y,face,effectClockTick,event.x+(event.radius||32),event.y);
  if(kind==='slow_applied')admitEffect('frost_hit',event.x,event.y-16,face);
  if(kind==='chain_link')admitEffect('chain_arc',event.fromX,event.fromY-16,face,effectClockTick,event.toX,event.toY-16);
  if(kind==='burrow_warning')admitEffect('burrow_warning',event.x,event.y,face);
  if(kind==='burrow_emerge'){admitEffect('burrow_emerge',event.x,event.y,face);if(actor)visualFor(actor).attack=visualTime;}
  if(kind==='split_spawn')admitEffect('slime_split',event.x,event.y,face);
  if(kind==='resolved_hit'&&event.amount>0&&event.delivery!=='poison')admitEffect(event.sourceKind==='drake'&&event.delivery==='melee'?'drake_claw':'hit_spark',event.x,event.y-16,face);
  if(kind==='projectile_release'&&(event.sourceKind||event.k)==='cannon')admitEffect('muzzle_flash',event.x+face*25,event.y-16,face);
  if(kind==='golem_ground_contact')admitEffect('ground_slam',event.x,event.y,face);
  if(kind==='heal'&&event.actualAmount>0)admitEffect('magic_sparkle',event.x,event.y-18,face);
  if(kind==='summon_spawn'&&event.k!=='slimelet'){
   admitEffect('magic_sparkle',event.x,event.y-16,face);
   if(actor)visualFor(actor).attack=visualTime;
  }
 }
}
function drawEffect(kind,x,y,age,face=1,angle=null){
 const meta=EFFECT_META[kind],image=effectImages[kind];if(!meta||!image?.complete||!image.naturalWidth)return false;
 if(age<0)return false;
 if(kind!=='arrow'&&age>=meta.frames/meta.fps*60)return false;
 let frame=lowEffects?0:Math.floor(age*meta.fps/60);
 if(kind==='arrow')frame%=meta.frames;else if(frame>=meta.frames)return false;
 ctx.save();ctx.translate(Math.round(x),Math.round(y));if(angle!==null)ctx.rotate(angle);else ctx.scale(face,1);

 q('#message').textContent=label;q('#breakdown').textContent=Number.isSafeInteger(entry?.delta)?credits(entry.delta):'—';
 if(q('#resultWinner'))q('#resultWinner').textContent=outcome==='A'?'左の勝利':outcome==='B'?'右の勝利':'';
 if(q('#resultRanking')){q('#resultRanking').hidden=!multiSession||round<sessionRoundLimit();q('#resultRanking').textContent=multiSession&&round>=sessionRoundLimit()?(multiSnapshot.wallets||[]).slice().sort((a,b)=>b.score-a.score).map(p=>(p.playerId===multiUser?'あなた':p.playerId)+' '+credits(p.score)).join(' · '):'';}
 q('#gameScreen')?.setAttribute('data-personal-result','true');q('#gameScreen')?.setAttribute('data-field-view','true');
 q('#resultPanel')?.setAttribute('data-final',String(round>=sessionRoundLimit()||soloTerminalBoundary()));
 q('#resultPanel')?.setAttribute('data-outcome',entry?.correct===true?'hit':entry?.correct===false?'miss':'neutral');
 // Keep the final canonical field visible; never fabricate a missing guest replay.
 q('#battle').hidden=!!multiSession&&!multiReplay;q('#battleControls').hidden=true;
 for(const id of ['#battleClock','#unitsToggle','#soundToggle','#reactionToggle','#formationBack'])if(q(id))q(id).hidden=true;
 if(document.hidden===true){cancelPersonalResult();return;}if(!Number.isFinite(now)||scene.cancelled)return;
 if(scene.start===null)scene.start=now;const elapsed=Math.max(0,now-scene.start);syncBattleAudio();
 const advance=(stage,at,fn)=>{if(scene.stage<stage&&elapsed>=at){scene.stage=stage;fn();}};
 advance(1,120,()=>{audioCall(()=>battleAudio.playResultStage(audioBattleKey(),'stamp'));resultAnimate('#message',[{opacity:.45,transform:'scale(.88)'},{opacity:1,transform:'scale(1.04)'},{opacity:1,transform:'scale(1)'}],{duration:200,easing:'ease-out'});});
 advance(2,280,()=>{if(Number.isSafeInteger(entry?.delta))audioCall(()=>battleAudio.playResultStage(audioBattleKey(),'delta',{delta:entry.delta,stake:entry.stake}));resultAnimate('#breakdown',[{transform:'translateY(5px)',opacity:.65},{transform:'translateY(-2px)',opacity:1},{transform:'translateY(0)',opacity:1}],{duration:230,easing:'ease-out'});});
 advance(3,450,()=>{audioCall(()=>battleAudio.playResultStage(audioBattleKey(),'balance'));if(entry?.delta!==0&&Number.isSafeInteger(entry?.delta))resultAnimate('#balance',[{opacity:.6},{opacity:1}],{duration:180});});
}
const personalUpdate=update;update=function(){personalUpdate();syncPersonalResult();};
const personalDisplay=displayMultiState;displayMultiState=function(){personalDisplay();syncPersonalResult();};
const personalLoop=loop;loop=function(t){personalLoop(t);syncPersonalResult(t);};
const personalScreen=showScreen;showScreen=function(next){if(next!=='game')cancelPersonalResult();personalScreen(next);syncPersonalResult();};
if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelPersonalResult();});

// Explicit solo-only extension boundary. Multiplayer stays its existing ten-round protocol.
function syncExtensionControls(){const atBoundary=!multiSession&&state==='result'&&soloTerminalBoundary()&&!soloRunEnded;document.querySelector('#extensionChoices').hidden=!atBoundary||SoloWallet.isBankrupt(walletState);const net=document.querySelector('#checkpointNet');net.hidden=!atBoundary;if(atBoundary)net.textContent='開始時より '+credits(currentWallet().score);if(atBoundary){const next=document.querySelector('#next');next.hidden=false;next.disabled=false;next.textContent='終了';}}
function extendSoloRun(additionalRounds){if(multiSession||state!=='result'||soloRunEnded||walletState.completedRounds!==walletState.maxRounds||SoloWallet.isBankrupt(walletState))return false;const before=walletState;walletState=SoloWallet.extendSession(before,{sessionId:before.sessionId,requestId:'extend:'+round,roundId:round,additionalRounds});try{nextPrediction();}catch(error){walletState=before;throw error;}syncExtensionControls();return true;}
function finishSoloRun(){if(multiSession||state!=='result'||!soloTerminalBoundary()||soloRunEnded)return false;soloRunEnded=true;void submitFinalScore('finish');showScreen('home');document.querySelector('#soloStart').textContent='もう一度';syncExtensionControls();return true;}
for(const n of [5,10])document.querySelector('#extend'+n).onclick=()=>extendSoloRun(n);
const extensionNext=document.querySelector('#next').onclick;document.querySelector('#next').onclick=e=>{if(!multiSession&&state==='result'&&soloTerminalBoundary())finishSoloRun();else extensionNext(e);};
const extensionStart=document.querySelector('#soloStart').onclick;document.querySelector('#soloStart').onclick=e=>{if(soloRunEnded&&!multiSession){round=1;freshWallet();openPrediction((Math.random()*4294967296)>>>0);}extensionStart(e);};
const extensionUpdate=update;update=function(){extensionUpdate();syncExtensionControls();};
const extensionDisplay=displayMultiState;displayMultiState=function(){extensionDisplay();syncExtensionControls();};
const extensionLoop=loop;loop=function(t){extensionLoop(t);syncExtensionControls();};
syncExtensionControls();

requestAnimationFrame(loop);
if(typeof window!=='undefined'&&window.__gameBootComplete)window.__gameBootComplete();
</script></body></html>
